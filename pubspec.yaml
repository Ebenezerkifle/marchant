name: marchant
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  file_picker: ^8.0.6
  firebase_core: ^3.1.1
  firebase_storage: ^12.1.0
  flutter_spinkit: ^5.2.1
  flutter:
    sdk: flutter
  font_awesome_flutter: ^10.7.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  url_launcher: ^6.3.0
  flutter_launcher_icons: "^0.13.1"
  easy_localization: ^3.0.5



dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/translations/
    

